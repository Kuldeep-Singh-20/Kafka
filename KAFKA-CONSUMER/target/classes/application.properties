spring.application.name=KAFKA-CONSUMER

server.port=8282
spring.kafka.bootstrap-server=localhost:9092

spring.kafka.consumer.group-id=employee-group
spring.kafka.consumer.auto-offset-reset=earliest

#earliest-> fetch the data from topic ...this data should be latest and older mean previous store and this
#is used for backup and history data. and must be changes their group id.

#latest-> fetch the latest data only from topic.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#deserializer -> it is used to get the data from kafka topic.

# Allow JSON deserialization for your package
#spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.kafka